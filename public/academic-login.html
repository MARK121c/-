<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOAL TRACKER — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      background: #050608;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .ambient-glow {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,85,0,0.15) 0%, rgba(255,51,0,0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FF5500;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
    }
    .main-stage {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 1100px;
      margin: auto;
      width: 100%;
      z-index: 10;
      padding: 40px 0;
    }
    @media (max-width: 900px) {
      .main-stage { flex-direction: column; text-align: center; gap: 40px; }
    }
    .avatar-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (max-width: 600px) {
      .avatar-wrapper { width: 240px; height: 240px; }
    }
    .avatar-ring {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 1px dashed rgba(255,85,0,0.3);
      animation: spin 30s linear infinite;
    }
    .avatar-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,85,0,0.35) 0%, transparent 70%);
      filter: blur(20px);
    }
    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #FF5500;
      object-fit: cover;
      object-position: top;
      box-shadow: 0 0 50px rgba(255,85,0,0.45);
    }
    .form-side {
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 8px;
      background: rgba(255,85,0,0.15);
      border: 1px solid rgba(255,85,0,0.3);
      color: #FF5500;
      font-size: 11px;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
    }
    @media (max-width: 900px) {
      .badge { align-self: center; }
    }
    .title {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      font-weight: 600;
    }
    .password-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #FF5500; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF5500, #FF3300);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255,85,0,0.4);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #555;
      font-family: 'JetBrains Mono', monospace;
      z-index: 10;
    }
    .error-msg {
      color: #EF4444;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span>🛡️ MARK OS</span>
    </div>
  </header>

  <!-- Main Full-Page Stage -->
  <main class="main-stage">
    <!-- Huge Hero Avatar -->
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <div class="avatar-glow"></div>
      <img src="/profile-hero.png" alt="Mark Emad" class="avatar-img" onerror="this.src='/icon-512.png'">
    </div>

    <!-- Controls -->
    <div class="form-side">
      <div class="badge">MARK OS V4.0</div>
      <h1 class="title">GOAL TRACKER</h1>
      <p class="subtitle">نظام التتبع والإنتاجية والكورسات المتكامل</p>

      <div id="errorBox" class="error-msg"></div>

      <!-- Default / Primary: Email + Password Only -->
      <form id="passwordStage" class="password-form" onsubmit="handlePasswordLogin(event)">
        <input type="text" id="loginEmail" class="input-field" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
        <input type="password" id="loginPassword" class="input-field" placeholder="كلمة المرور" required>
        <button type="submit" id="submitBtn" class="submit-btn">تسجيل الدخول للنظام</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    MARK EMAD OS • CYBERPUNK EDITION • 2026
  </footer>

  <script>
    async function handlePasswordLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');

      submitBtn.innerText = 'جاري التحقق...';
      submitBtn.disabled = true;
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok && (data.success || data.token)) {
          if (data.token) localStorage.setItem('academic_token', data.token);
          if (data.user) localStorage.setItem('academic_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          errorBox.innerText = data.error || 'بيانات الدخول غير صحيحة';
          errorBox.style.display = 'block';
        }
      } catch {
        errorBox.innerText = 'حدث خطأ أثناء الاتصال بالخادم';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.innerText = 'تسجيل الدخول للنظام';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
