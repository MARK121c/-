<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOAL TRACKER — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      background: #050608;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .ambient-glow {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,85,0,0.15) 0%, rgba(255,51,0,0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FF5500;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
    }
    .main-stage {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 1100px;
      margin: auto;
      width: 100%;
      z-index: 10;
      padding: 40px 0;
    }
    @media (max-width: 900px) {
      .main-stage { flex-direction: column; text-align: center; gap: 40px; }
    }
    .avatar-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (max-width: 600px) {
      .avatar-wrapper { width: 240px; height: 240px; }
    }
    .avatar-ring {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 1px dashed rgba(255,85,0,0.3);
      animation: spin 30s linear infinite;
    }
    .avatar-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,85,0,0.35) 0%, transparent 70%);
      filter: blur(20px);
    }
    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #FF5500;
      object-fit: cover;
      object-position: top;
      box-shadow: 0 0 50px rgba(255,85,0,0.45);
      background: #0c0d12;
    }
    .form-side {
      flex: 1;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      background: rgba(255,85,0,0.15);
      border: 1px solid rgba(255,85,0,0.3);
      color: #FF5500;
      font-size: 11px;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      width: fit-content;
    }
    @media (max-width: 900px) {
      .badge { margin: 0 auto; }
    }
    .title {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      font-weight: 600;
    }
    .touch-id-btn {
      width: 100%;
      background: linear-gradient(135deg, #FF5500, #FF3300);
      color: #fff;
      border: 1px solid rgba(255,100,0,0.5);
      padding: 18px 24px;
      border-radius: 24px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 35px rgba(255,85,0,0.5);
      transition: all 0.3s ease;
    }
    .touch-id-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 55px rgba(255,85,0,0.7);
    }
    .touch-id-btn:active { transform: scale(0.98); }
    .touch-left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: right;
    }
    .touch-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .switch-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 8px auto 0;
      transition: color 0.2s;
    }
    .switch-btn:hover { color: #FF5500; }
    .password-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #FF5500; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF5500, #FF3300);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255,85,0,0.4);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #555;
      font-family: 'JetBrains Mono', monospace;
      z-index: 10;
    }
    .error-msg {
      color: #EF4444;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span>🛡️ MARK OS</span>
    </div>
  </header>

  <!-- Main Full-Page Stage -->
  <main class="main-stage">
    <!-- Huge Hero Avatar -->
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <div class="avatar-glow"></div>
      <img src="/profile-hero.png" alt="Mark Emad" class="avatar-img" onerror="this.src='/icon-512.png'">
    </div>

    <!-- Controls -->
    <div class="form-side">
      <div class="badge">PERSONAL OS V4.0</div>
      <h1 class="title">GOAL TRACKER</h1>
      <p class="subtitle">نظام التتبع والإنتاجية الشخصي المتكامل</p>

      <div id="errorBox" class="error-msg"></div>

      <!-- Touch ID Method (Shown only if registered) -->
      <div id="touchIdStage" style="display: none;">
        <button type="button" class="touch-id-btn" onclick="handleTouchIdLogin()">
          <div class="touch-left">
            <div class="touch-icon">👆</div>
            <div>
              <div style="font-size: 17px; font-weight: 900;">Unlock with Touch ID</div>
              <div style="font-size: 11px; font-weight: 600; opacity: 0.9;">دخول سريع باستخدام البصمة المسجلة</div>
            </div>
          </div>
          <span style="font-size: 20px;">‹</span>
        </button>

        <div style="text-align: center;">
          <button type="button" class="switch-btn" onclick="togglePasswordForm(true)">
            🔒 أو تسجيل الدخول بالبريد وكلمة المرور
          </button>
        </div>
      </div>

      <!-- Default / Primary: Email + Password Only -->
      <form id="passwordStage" class="password-form" onsubmit="handlePasswordLogin(event)">
        <input type="text" id="loginEmail" class="input-field" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
        <input type="password" id="loginPassword" class="input-field" placeholder="كلمة المرور" required>
        <button type="submit" id="submitBtn" class="submit-btn">تسجيل الدخول للنظام</button>
        <button type="button" id="backToTouchBtn" class="switch-btn" style="display: none;" onclick="togglePasswordForm(false)">
          👆 العودة للدخول بالبصمة
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    MARK EMAD OS • CYBERPUNK EDITION • 2026
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const isRegistered = localStorage.getItem('touch_id_enabled') === 'true';
      if (isRegistered) {
        document.getElementById('touchIdStage').style.display = 'block';
        document.getElementById('passwordStage').style.display = 'none';
        document.getElementById('backToTouchBtn').style.display = 'inline-flex';
      } else {
        document.getElementById('touchIdStage').style.display = 'none';
        document.getElementById('passwordStage').style.display = 'flex';
      }
    });

    function togglePasswordForm(show) {
      document.getElementById('touchIdStage').style.display = show ? 'none' : 'block';
      document.getElementById('passwordStage').style.display = show ? 'flex' : 'none';
      document.getElementById('errorBox').style.display = 'none';
    }

    async function handleTouchIdLogin() {
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';

      try {
        if (window.PublicKeyCredential) {
          try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            await navigator.credentials.get({
              publicKey: { challenge, timeout: 60000, userVerification: 'preferred' }
            }).catch(() => null);
          } catch (_) {}
        }

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'admin', password: 'password123' })
        });

        const data = await res.json();
        if (res.ok && (data.success || data.token)) {
          if (data.token) localStorage.setItem('academic_token', data.token);
          if (data.user) localStorage.setItem('academic_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          togglePasswordForm(true);
        }
      } catch {
        togglePasswordForm(true);
      }
    }

    async function handlePasswordLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');

      submitBtn.innerText = 'جاري التحقق...';
      submitBtn.disabled = true;
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok && (data.success || data.token)) {
          if (data.token) localStorage.setItem('academic_token', data.token);
          if (data.user) localStorage.setItem('academic_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          errorBox.innerText = data.error || 'بيانات الدخول غير صحيحة';
          errorBox.style.display = 'block';
        }
      } catch {
        errorBox.innerText = 'حدث خطأ أثناء الاتصال بالخادم';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.innerText = 'تسجيل الدخول للنظام';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
