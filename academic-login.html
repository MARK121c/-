<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARK OS — تسجيل الدخول للنظام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --color-emerald: #10B981; --color-emerald-bright: #34D399;
      --color-emerald-glow: rgba(16,185,129,0.35);
      --color-orange: #FF6B00; --color-orange-bright: #FF8533;
      --color-bg: #07080c; --color-surface: #0d0f14; --color-surface-2: #12151c;
      --color-card: rgba(16,19,27,0.85);
      --text-primary: #F5F6FA; --text-secondary: rgba(245,246,250,0.72);
      --text-muted: rgba(245,246,250,0.42);
      --border-subtle: rgba(255,255,255,0.08); --border-medium: rgba(255,255,255,0.15);
      --font-latin: 'Plus Jakarta Sans', sans-serif; --font-arabic: 'Cairo', sans-serif;
      --r-sm: 14px; --r-md: 20px; --r-lg: 28px;
      --ease: cubic-bezier(0.16,1,0.3,1);
    }
    [dir="rtl"] { font-family: var(--font-arabic); }
    [dir="ltr"] { font-family: var(--font-latin); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--color-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; position: relative; }

    .ambient-glow { position: fixed; border-radius: 50%; filter: blur(120px);
      pointer-events: none; z-index: 0; opacity: 0.2; }
    .glow-1 { width: 450px; height: 450px; background: radial-gradient(circle, var(--color-emerald) 0%, transparent 70%);
      top: -120px; right: -120px; }
    .glow-2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--color-orange) 0%, transparent 70%);
      bottom: -100px; left: -100px; }

    .lang-btn { position: fixed; top: 20px; right: 20px; z-index: 10;
      background: var(--color-surface-2); border: 1px solid var(--border-medium);
      color: var(--text-secondary); padding: 8px 16px; border-radius: var(--r-sm);
      cursor: pointer; font-size: 0.85rem; font-weight: 700; transition: all 0.2s var(--ease); }
    .lang-btn:hover { border-color: var(--color-emerald); color: var(--text-primary); }
    [dir="ltr"] .lang-btn { right: auto; left: 20px; }

    .login-card { position: relative; z-index: 1; width: 100%; max-width: 440px;
      background: var(--color-card); backdrop-filter: blur(25px);
      border: 1px solid var(--border-medium); border-radius: var(--r-lg);
      padding: 48px 36px; margin: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      animation: slideUp 0.6s var(--ease); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .login-brand { text-align: center; margin-bottom: 32px; }
    .brand-icon { width: 56px; height: 56px; border-radius: 18px; background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3); color: var(--color-emerald);
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .login-brand h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; }
    .login-brand p { font-size: 0.88rem; color: var(--color-emerald); font-weight: 700; }

    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-secondary);
      margin-bottom: 8px; font-weight: 600; }
    .form-group input { width: 100%; padding: 14px 16px 14px 44px; background: var(--color-surface);
      border: 1px solid var(--border-subtle); border-radius: var(--r-sm); color: var(--text-primary);
      font-size: 0.95rem; font-family: inherit; font-weight: 600; transition: all 0.25s var(--ease); outline: none; }
    [dir="rtl"] .form-group input { padding: 14px 44px 14px 16px; }
    .form-group input:focus { border-color: var(--color-emerald);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-icon { position: absolute; top: 40px; left: 14px; color: var(--text-muted);
      pointer-events: none; width: 18px; height: 18px; }
    [dir="rtl"] .form-icon { left: auto; right: 14px; }

    .toggle-pw { position: absolute; top: 40px; right: 14px; background: none;
      border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    [dir="rtl"] .toggle-pw { right: auto; left: 14px; }
    .toggle-pw:hover { color: var(--text-primary); }

    .login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--color-emerald), var(--color-emerald-bright));
      border: none; border-radius: var(--r-sm); color: #000; font-size: 1rem;
      font-weight: 800; cursor: pointer; font-family: inherit;
      transition: all 0.25s var(--ease); margin-top: 8px;
      box-shadow: 0 8px 25px rgba(16,185,129,0.3); }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(16,185,129,0.45); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.3);
      color: #ff6b6b; padding: 12px 16px; border-radius: var(--r-sm);
      font-size: 0.85rem; margin-bottom: 16px; display: none; font-weight: 700;
      animation: shake 0.4s var(--ease); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    .credentials-hint { margin-top: 24px; padding: 14px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-subtle); border-radius: var(--r-sm); text-align: center;
      font-size: 0.78rem; color: var(--text-muted); }
    .credentials-hint strong { color: var(--text-secondary); }

    @media(max-width:480px) {
      .login-card { padding: 36px 24px; margin: 16px; }
      .login-brand h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <button class="lang-btn" id="langToggle">EN / العربية</button>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>MARK OS</h1>
      <p id="brandSub">نظام التحكم المركزي الذكي</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label id="lblUser">اسم المستخدم أو البريد الإلكتروني</label>
        <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="admin أو test@mark.os" required />
      </div>

      <div class="form-group">
        <label id="lblPass">كلمة المرور</label>
        <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
        <button type="button" class="toggle-pw" id="togglePw" tabindex="-1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">دخول النظام المتكامل</button>
    </form>

    <div class="credentials-hint" id="credHint">
      حساب المدير: <strong>admin</strong> | كلمة المرور: <strong>admin123</strong>
    </div>
  </div>

  <script>
    let lang = localStorage.getItem('academic_lang') || 'ar';
    const t = {
      ar: { sub: 'نظام التحكم المركزي الذكي', user: 'اسم المستخدم أو البريد الإلكتروني', pass: 'كلمة المرور',
            btn: 'دخول النظام المتكامل', title: 'MARK OS — تسجيل الدخول',
            hint: 'حساب المدير: <strong>admin</strong> | كلمة المرور: <strong>admin123</strong>',
            errRequired: 'يرجى إدخال اسم المستخدم وكلمة المرور',
            errInvalid: 'بيانات الدخول غير صحيحة، تأكد من اسم المستخدم وكلمة المرور',
            errDisabled: 'الحساب معطل', errServer: 'خطأ في الاتصال بالسيرفر' },
      en: { sub: 'Central Intelligence System', user: 'Username or Email', pass: 'Password',
            btn: 'Access Complete System', title: 'MARK OS — Sign In',
            hint: 'Admin: <strong>admin</strong> | Password: <strong>admin123</strong>',
            errRequired: 'Please enter username and password',
            errInvalid: 'Invalid credentials. Please check username and password',
            errDisabled: 'Account is disabled', errServer: 'Server connection error' }
    };

    function setLang(l) {
      lang = l; localStorage.setItem('academic_lang', l);
      const isRtl = l === 'ar';
      document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
      document.documentElement.lang = l;
      document.getElementById('brandSub').textContent = t[l].sub;
      document.getElementById('lblUser').textContent = t[l].user;
      document.getElementById('lblPass').textContent = t[l].pass;
      document.getElementById('loginBtn').textContent = t[l].btn;
      document.getElementById('credHint').innerHTML = t[l].hint;
      document.title = t[l].title;
    }
    setLang(lang);

    document.getElementById('langToggle').addEventListener('click', () => {
      setLang(lang === 'ar' ? 'en' : 'ar');
    });

    document.getElementById('togglePw').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errEl.textContent = t[lang].errRequired;
        errEl.style.display = 'block'; return;
      }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email: username, password })
        });
        const data = await res.json();

        if (data.success || res.ok) {
          if (data.token) {
            localStorage.setItem('academic_token', data.token);
          }
          if (data.user) {
            localStorage.setItem('academic_user', JSON.stringify(data.user));
          }
          // Redirect to the FULL integrated system
          window.location.href = '/';
        } else {
          errEl.textContent = data.message || (data.error === 'Account is disabled' ? t[lang].errDisabled : t[lang].errInvalid);
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = t[lang].errServer;
        errEl.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = t[lang].btn;
    });

    // Check if already logged in
    if (localStorage.getItem('academic_token')) {
      fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('academic_token') } })
        .then(r => r.json())
        .then(d => {
          if (d && d.success) {
            window.location.href = '/';
          }
        }).catch(() => {});
    }
  </script>
</body>
</html>
